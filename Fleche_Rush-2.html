 <div class="row"><button class="btn" onclick="cwHint()">💡 Lettre</button><button class="btn" onclick="cwWordRev()">🪄 Mot · 40🪙</button><button class="btn" onclick="cwCheck()">✓ Vérifier</button><button class="btn" onclick="cwList()">📋 Définitions</button><button class="btn" onclick="cwNew()">⟳</button></div>`);
 clearInterval(CW.tm);CW.tm=setInterval(()=>{const e=$('#cwt');if(!e||$('#cq').hidden)return clearInterval(CW.tm);e.textContent='⏱ '+Math.floor((Date.now()-CW.t0)/1000)+' s'},1000)}
function cwTap(r,c){const same=CW.sel[0]==r&&CW.sel[1]==c;if(same){if(cwWord(r,c,0)&&cwWord(r,c,1))CW.dir=1-CW.dir}else{CW.sel=[r,c];if(!cwWord(r,c,CW.dir))CW.dir=1-CW.dir}sfx('cwk');cwRender()}
function cwStep(n){const i=CW.words.findIndex(x=>x===(cwWord(...CW.sel,CW.dir)||cwWord(...CW.sel,1-CW.dir))),x=CW.words[(i+n+CW.words.length)%CW.words.length];CW.sel=[x.r,x.col];CW.dir=x.d;sfx('cwk');cwRender()}
function cwList(){const f=d=>CW.words.filter(x=>x.d==d).sort((a,b)=>a.n-b.n).map(x=>`<button class="btn" style="text-align:left;width:100%" onclick="CW.sel=[${x.r},${x.col}];CW.dir=${x.d};cwRender()">${x.n}. ${x.c} <small>(${x.w.length})</small></button>`).join('');
 ov(`<h2>Définitions</h2><div class="st">Horizontal →</div>${f(0)}<div class="st">Vertical ↓</div>${f(1)}<button class="btn" onclick="cl();cwRender()">Fermer</button>`)}
function cwType(ch){const[r,c]=CW.sel;if(CW.rev[r+','+c]){return cwAdv(1)}CW.inp[r][c]=ch;delete CW.bad[r+','+c];sfx('cwk');const w=cwWord(r,c,CW.dir);if(w)cwDoneCheck();if(ch)cwAdv(1);else cwAdv(-1);cwFinish()}
function cwAdv(n){const w=cwWord(...CW.sel,CW.dir);if(!w){return cwRender()}const cs=cwCells(w),i=cs.findIndex(p=>p[0]==CW.sel[0]&&p[1]==CW.sel[1]),j=i+n;if(j>=0&&j<cs.length)CW.sel=cs[j];cwRender()}
function cwDoneCheck(){CW.words.forEach((x,i)=>{if(!CW.done[i]&&cwCells(x).every(([r,c])=>CW.inp[r][c]==CW.sol[r][c])){CW.done[i]=1;sfx('cwok')}})}
function cwCheck(){let n=0;CW.bad={};for(let r=0;r<CW.rows;r++)for(let c=0;c<CW.cols;c++)if(CW.inp[r][c]&&CW.inp[r][c]!=CW.sol[r][c]){CW.bad[r+','+c]=1;n++}CW.chk=1;sfx(n?'cwbad':'right');toast(n?n+' lettre(s) incorrecte(s)':'✅ Tout est correct jusque-là');cwRender()}
function cwHint(){if(!use('hints'))return;const[r,c]=CW.sel;CW.inp[r][c]=CW.sol[r][c];CW.rev[r+','+c]=1;CW.aid=1;delete CW.bad[r+','+c];sfx('hint');save();cwDoneCheck();cwRender();cwFinish()}
function cwWordRev(){if(S.coins<40){sfx('no');return toast('Pas assez de pièces')}const w=cwWord(...CW.sel,CW.dir);if(!w)return;S.coins-=40;cwCells(w).forEach(([r,c])=>{CW.inp[r][c]=CW.sol[r][c];CW.rev[r+','+c]=1;delete CW.bad[r+','+c]});CW.aid=1;sfx('hint');save();cwDoneCheck();cwRender();cwFinish()}
function cwFinish(){if(CW.over)return;for(let r=0;r<CW.rows;r++)for(let c=0;c<CW.cols;c++)if(CW.sol[r][c]&&CW.inp[r][c]!=CW.sol[r][c])return;CW.over=1;clearInterval(CW.tm);const n=CW.words.length,g=n*5+(CW.aid||CW.chk?0:20),tm=Math.floor((Date.now()-CW.t0)/1000);S.coins+=g;S.cw.done++;S.cw.words+=n;if(CW.diff=='hard')S.cw.hard++;if(!CW.aid)S.cw.pure++;save();sfx('win');confetti();
 setTimeout(()=>{ov(`<div style="font-size:56px">🎉</div><h2>Grille terminée !</h2><div>${n} mots · ⏱ ${tm} s</div><div>+${g} 🪙${CW.aid||CW.chk?'':' · bonus sans aide !'}</div><button class="btn big" onclick="cl();cwNew()">Grille suivante</button><button class="btn" onclick="cl();cwMenu()">Menu</button>`);chk()},700)}
document.addEventListener('keydown',e=>{if(!CW||$('#cq').hidden||CW.over||!$('#ov').hidden)return;if(/^[a-zA-Z]$/.test(e.key))cwType(e.key.toUpperCase());else if(e.key=='Backspace')cwType('');else if(e.key==' '||e.key=='Tab'){e.preventDefault();cwStep(1)}});
</script></body></html>
